<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tava — meal recommender</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Palette: warm cream + spice */
    --bg: oklch(0.972 0.012 76);
    --bg-2: oklch(0.955 0.014 74);
    --paper: oklch(0.99 0.006 80);
    --ink: oklch(0.22 0.012 60);
    --ink-2: oklch(0.38 0.013 60);
    --muted: oklch(0.58 0.012 70);
    --line: oklch(0.90 0.014 75);
    --line-2: oklch(0.93 0.012 75);
    --accent: oklch(0.60 0.135 42);     /* terracotta */
    --accent-ink: oklch(0.36 0.10 40);
    --olive: oklch(0.56 0.08 115);
    --saffron: oklch(0.78 0.13 78);
    --leaf: oklch(0.68 0.09 145);

    /* radii */
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 22px;
    --r-xl: 28px;
  }
  html,body{margin:0;padding:0;background:#1d1a16;}
  body{
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  *{box-sizing:border-box;}
  button{font-family:inherit;}
  /* Stage */
  .stage{
    min-height: 100vh;
    width: 100%;
    background:
      radial-gradient(1200px 700px at 20% -10%, oklch(0.30 0.04 60) 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, oklch(0.28 0.05 40) 0%, transparent 55%),
      linear-gradient(180deg, #1f1c17 0%, #15130f 100%);
    display: grid;
    place-items: center;
    padding: 32px 16px 56px;
  }
  .stage-inner{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .brand-row{
    color: oklch(0.85 0.02 80);
    font-family: 'Instrument Serif', serif;
    font-size: 34px;
    letter-spacing: -0.01em;
    display:flex; align-items:baseline; gap:14px;
  }
  .brand-row .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--accent); transform: translateY(-4px);
    display:inline-block;
  }
  .brand-row .sub{
    font-family:'Geist Mono', ui-monospace, monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color: oklch(0.65 0.02 80);
  }
  /* shimmer */
  @keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
  .shimmer{
    background: linear-gradient(90deg, var(--bg-2) 0%, var(--paper) 50%, var(--bg-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:.3;transform:scale(.8);} 50%{opacity:1;transform:scale(1);} }
  @keyframes fade-up { from{opacity:0; transform: translateY(10px);} to{opacity:1; transform:none;} }
  .fade-up{animation: fade-up 420ms cubic-bezier(.2,.7,.2,1) both;}
  @keyframes sheet-up { from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet-up{animation: sheet-up 360ms cubic-bezier(.2,.8,.2,1) both;}
  @keyframes fade-in { from{opacity:0;} to{opacity:1;} }
  .fade-in{animation: fade-in 220ms ease-out both;}

  /* scrollbar hidden inside frame */
  .phone-scroll::-webkit-scrollbar{display:none;}
  .phone-scroll{scrollbar-width:none;}

  /* Tap feedback */
  .tap{transition: transform 120ms ease, background 160ms ease, border-color 160ms ease;}
  .tap:active{transform: scale(0.97);}
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
